name: myzilla
services:
  app:
    build: .
    restart: unless-stopped
    user: "${MYZILLA_UID:-1000}:${MYZILLA_GID:-1000}"
    environment:
      MYZILLA_TOKEN: ${MYZILLA_TOKEN:?Set MYZILLA_TOKEN in .env}
      MYZILLA_DB: /data/myzilla.sqlite
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://myzilla.observe.tw}
      HOST: 0.0.0.0
      PORT: 18140
    ports:
      - "127.0.0.1:18140:18140"
    volumes:
      - ./data:/data
    init: true
    security_opt:
      - no-new-privileges:true
