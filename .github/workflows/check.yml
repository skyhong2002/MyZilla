name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:importer
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:community
      - run: npm run test:google
      - run: npm run test:insights
      - run: npm run test:usability
      - run: npm run test:portal
      - run: npm run test:firefox
      - run: docker build -t myzilla:check .
      - run: node tests/container-smoke.mjs myzilla:check
